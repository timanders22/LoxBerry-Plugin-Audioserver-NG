[AUTOUPDATE]
# Diese Datei liegt im Wurzelverzeichnis des GitHub-Repositorys timanders22/LoxBerry-Plugin-Audioserver-NG und steuert
# dort das Auto-Update. Eine release.cfg ohne VERSION-Zeile waere der schlechteste Fall.
#
# Bei jedem Release drei Stellen gleichzeitig anfassen:
#   1. plugin.cfg  -> VERSION
#   2. release.cfg -> VERSION und BEIDE Adressen auf den neuen Tag
#   3. auf GitHub ein Release mit genau diesem Tag (vX.Y.Z)
# Die plugin.cfg liest DIESE Datei aus dem ZWEIG main, ARCHIVEURL zieht aus dem TAG.
#
# Repository angelegt am 01.11.2026 mit der Fassung 0.9.0.

VERSION=0.9.1
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-Audioserver-NG/archive/refs/tags/v0.9.1.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-Audioserver-NG/releases/tag/v0.9.1
