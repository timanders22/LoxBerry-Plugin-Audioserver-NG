[LOX]
WAS_IST_DAS = "How to integrate sonn in Loxone Config: as Audioserver with an Audio Player per room. The MQTT values are only needed for own logic - operation and display come via the Audio Player."
S1_TITEL = "Step 1 - Audioserver object in Loxone Config"
S1_TEXT = "Create an Audioserver object in the periphery tree and enter these values. Then load the project into the Miniserver (the operator does that himself, at a quiet time)."
SERIENNUMMER = "Serial number (from the MAC)"
SONN_MELDET = "MAC id reported by sonn itself"
HOST = "Host (address of sonn)"
VERWALTUNG = "sonn admin in the browser"
S1_HINWEIS = "Authoritative is the serial number shown by the sonn admin under Zones at Loxone integrated. If the MAC id reported by sonn differs from the configured one, the container is in the wrong network - Test tab."
S2_TITEL = "Step 2 - Pairing in sonn"
S2_TEXT = "Create a local account in the sonn admin, choose Loxone integrated under Zones. After uploading, the Miniserver connects; the Audioserver symbol in Config turns green."
S3_TITEL = "Step 3 - Audio Player per room, output in sonn"
S3_TEXT = "Drag one Audio Player per room from the Audioserver into the project. In sonn choose output Google Cast and the speaker of the room for each zone. Google groups cannot be selected; multi-room via groups is done by Chromecast4lox."
S4_TITEL = "Step 4 - Values via MQTT (optional)"
S4_V2 = "Create a virtual input for every name (texts as virtual text input), name exactly as in the table, and tick the data point in gateway V2. The LoxBerry user on the Miniserver needs rights on every input."
S4_V1 = "Gateway V1: create virtual inputs with these names; the subscription file of the plugin brings the subscription."
SP_NAME = "Name (gateway)"
SP_BAUFORM = "Block"
BAUFORM_VI = "Virtual input"
BAUFORM_TEXT = "Virtual text input"
S4_SAETZE = "The zone rows follow the zones sonn reported last (without report: zone 1 as example)."
K_KOPIEREN = "Copy name"
KOPIERT = "copied"
S5_TITEL = "Step 5 - Commands (optional)"
S5_TEXT = "A virtual output to the UDP input of the MQTT gateway, one output command per command. The template contains both."
S5_HAKEN = "Commands only work with the checkbox accept commands via MQTT (MQTT tab); restart additionally needs allow restart from Loxone."
SP_BEFEHL = "Command"
SP_WERT = "Value"
SP_EINGREIFEND = "intervening"
SP_LOXONE = "Command in the virtual output"
K_VORLAGE = "Download command template"
F_VORLAGE = "The template could not be created (command bridge missing or not ready)."
S6_TITEL = "Step 6 - Doorbell and multi-room"
S6_TEXT = "The doorbell can go to the Bell input of the Audio Player. For a doorbell or announcement in several rooms at the same time, Chromecast4lox with Google groups remains the way - sonn does not play several rooms in sync."
H_MUSTER = "Example: how it looks in Loxone Config"
MUSTER_TEXT = "The three pictures show the pages of this plugin in the LoxBerry-Plugins sample project. There you can look at the blocks fully wired and copy them into your project."
BILD1_TEXT = "The page shows the service values (sonn reachable, health, pairing, number of zones, version), the heartbeat with failure detection and fault message, the status as text and the two command buttons restart and rescan library."
BILD2_TEXT = "The page shows the eight values per zone (state, volume, title, artist, source, name, output, connected) with a status that sums them up readably."
BILD3_TEXT = "The page shows the Audio Players living room and kitchen at the Audioserver object: buttons for louder, quieter, on, off and favourite, plus doorbell, alarm clock and announcement on both zones."
BILD_ALT = "Blocks of the plugin in Loxone Config – page “%s”"
BILD_UNTERSCHRIFT = "Page “%s” in the LoxBerry-Plugins sample project. Config shortens long block names – the full names are in the table above."
