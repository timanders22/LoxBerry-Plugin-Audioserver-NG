[TUNEIN]
H = "Radio: preset stations from TuneIn"
TEXT = "Without a TuneIn user, sonn shows three built-in stations under Radio → TuneIn Presets (BBC Radio 1, NPO Radio 2, KEXP). They cannot be deleted in sonn. With the tick, the plugin changes one line of a sonn file in the container for this and repeats that by itself after every recreation of the container. By default sonn stays unchanged. From sonn core 4.0.0-beta.23 these stations no longer exist; the tick then has nothing to do."
HAKEN = "Hide preset stations from TuneIn"
H_NEUSTART = "Changing this restarts sonn once, running playback stops. The file is backed up first; if the line changes with a new sonn version, the plugin replaces nothing and reports that here."
M_EIN = "Setting saved: hide preset stations."
M_AUS = "Setting saved: do not hide preset stations."
STAND_SICHTBAR = "State of the last minute: sonn shows its preset stations."
STAND_AUSGEBLENDET = "State of the last minute: the preset stations are hidden."
STAND_UNBEKANNT = "State of the last minute: the sonn file looks different than expected; nothing is hidden, nothing gets changed."
STAND_FEHLT = "State of the last minute: the sonn file is not in the expected place; nothing gets changed."
STAND_KEINER = "No state yet: sonn is not running or did not answer in the last minute."
STAND_ENTFALLEN = "State of the last minute: this version of sonn no longer shows preset stations itself (from sonn core 4.0.0-beta.23). The tick has nothing to do, nothing is changed."

