; Hilfetexte, deutsch. Gehoert zu templates/help/help.html. Jeder Wert in doppelten Anfuehrungszeichen, ohne solche darin.

[HILFE]
K01 = "Audioserver NG"
K02 = "Startet <b>sonn core</b>, die Nachbildung des Loxone Audioservers, als Docker-Container mit eigener Adresse im Heimnetz. Die Loxone App bedient die Zonen wie bei einem echten Audioserver; ausgegeben wird je Raum über einen Google-Cast-Lautsprecher."
K03 = "Grenzen"
K04 = "Keine synchrone Mehrraum-Wiedergabe über Google Cast (hörbarer, wachsender Versatz). Google-Gruppen sind in sonn nicht als Ausgang wählbar - Mehrraum und Klingel über Google-Gruppen macht <b>Chromecast4lox</b>. sonn core ist eine Beta; das Plugin nutzt eine festgelegte Fassung, ein Update nur nach Ja, mit Rückweg."
K05 = "So gehen Sie vor"
K06 = "<b>Einstellungen:</b> oben im Kasten „Audioserver einrichten“ die vorgeschlagenen Werte ansehen (Netz, Adresse, MAC gekürzt, Musikordner), den Ja-Haken setzen und auf „Audioserver einrichten“ klicken - das Plugin speichert, schaltet die Verwaltung ein und legt sonn an. Gibt es den Probe-Container sonn-probe, kommen die Werte aus ihm und seine Daten werden kopiert; die Probe bleibt stehen. Wer von Hand einstellen will, öffnet „Erweitert“. Danach führt die Liste „So geht es weiter“ durch die übrigen Schritte."
K17 = "Beispiele: Der Reiter „Einbindung in Loxone“ zeigt drei Bilder aus dem LoxBerry-Plugins Musterprojekt - die Seiten Audioserver NG (Dienstwerte, Lebenszeichen, Status, Befehlstasten), Audioserver NG Werte (je Zone 8 Werte mit Status) und Audioserver NG Zonen (Audio-Player mit Klingel, Wecker und Durchsage)."
K16 = "Die freie Adresse sucht das Plugin am oberen Ende des Heimnetzes (ping und ARP, ohne Adressen von Docker-Containern). Den DHCP-Bereich des Routers kann es nicht lesen, und ein ausgeschaltetes Gerät antwortet nicht - die Adresse deshalb im Router für sonn festhalten. Der Wert verbunden je Zone ist 1 (verbunden), 0 (nicht verbunden oder kein Ausgang) oder -1 (keine Aussage, so bei Google Cast)."
K07 = "<b>sonn-Verwaltung</b> unter http://Adresse:7090: Konto anlegen, unter Zones „Loxone integrated“, Bibliothek /musik hinzufügen."
K08 = "<b>Loxone Config:</b> Objekt Audioserver mit der Seriennummer aus dem Reiter „Einbindung in Loxone“ und der Adresse als Host, je Raum ein Audio-Player; in den Miniserver laden. In sonn je Zone den Google-Cast-Lautsprecher wählen."
K09 = "<b>MQTT und Test:</b> Datenpunkte der Hakenliste im Gateway V2 anhaken, dann den Reiter Test prüfen - besonders „Container hängt NUR im macvlan-Netz“ und „sonn meldet dieselbe MAC-Kennung“."
K10 = "Was das Plugin nicht tut"
K11 = "Es ändert nie ein fremdes Docker-Netz, entfernt den Probe-Container nur auf Ja und löscht nie die Daten von sonn - auch nicht bei der Deinstallation. Es lädt nichts in den Miniserver. Beim Neuanlegen (auch Update und Rückweg) bleibt der bisherige Container angehalten bereit, bis der neue läuft; scheitert der neue, kommt der alte zurück."
K12 = "Weitere Grenzen"
K13 = "Klingel und Wecker über sonn (beta.22): danach läuft die vorherige Wiedergabe nicht (dauerhaft) weiter; ein zweiter Alarm kann die Cast-Ausgabe bis zum Neustart des Containers stören. Der Weckton von sonn ist ein kurzer Gong. Durchsage aus der App geht, die Wiedergabe läuft danach weiter. Für die Klingel deshalb Chromecast4lox verwenden. War ein Google-Cast-Lautsprecher nicht erreichbar (z. B. ohne Strom), meldet sonn danach bei jedem Play einen Wiedergabefehler, auch wenn er wieder an ist - Lautsprecher einschalten, dann im Reiter Einstellungen „Container neu starten“ (alle Zonen brechen kurz ab; das Plugin tut das nie von selbst). Kein Einhängen von SMB-Freigaben in der sonn-Verwaltung - dafür bräuchte der Container Zusatzrechte, die das Plugin nicht vergibt; Musik kommt über die Speicherauswahl von LoxBerry. LoxBerry-Text2Speech ist als Sprachanbieter in sonn voraussichtlich nicht erreichbar (ein Container im macvlan-Netz erreicht seinen LoxBerry nicht) - in sonn Google oder OpenAI wählen. Die Daten von sonn gehören root: von Hand nur mit sudo löschen. Auf dem Raspberry Pi setzt der Kernel meist keine Speichergrenze für Container durch (cgroup_disable=memory): der Reiter Test zeigt das als Hinweis, kein Fehler - die CPU-Grenze wirkt."
K14 = "Vor jedem Update die Release-Hinweise von sonn auf Brüche lesen (Beispiel beta.18: Loxone nach frischer Konfiguration ausdrücklich einschalten, alte Audiopfade in Favoriten ungültig) und prüfen, ob sonn sein Paket auf ghcr.io umbenannt hat - dann bekommt der festgelegte Digest kein Update mehr. Die Liste der verfügbaren Fassungen liest nur; aktualisiert wird erst mit dem Ja-Haken."
K15 = "Die Datensicherung von LoxBerry (Klon der Speicherkarte) nimmt den Datenordner von sonn mit. Sie kopiert im laufenden Betrieb - für eine sicher stimmige Kopie sonn vorher stoppen."
