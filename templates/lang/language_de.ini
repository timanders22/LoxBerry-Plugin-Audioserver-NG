[EINST]
WAS_IST_DAS = "Audioserver NG startet sonn core - die Nachbildung des Loxone Audioservers - als Docker-Container mit eigener Adresse im Heimnetz. Die Loxone App bedient die Zonen dann wie bei einem echten Audioserver; ausgegeben wird je Raum über einen Google-Cast-Lautsprecher."
H_GRENZEN = "Grenzen - bitte vor der Einrichtung lesen"
GRENZEN_TEXT = "Keine synchrone Mehrraum-Wiedergabe über Google Cast: sonn hält mehrere Cast-Lautsprecher nicht im Takt, der Versatz ist hörbar und wächst nach einer Klingel. Google-Lautsprechergruppen sind in sonn nicht als Ausgang wählbar - Mehrraum und Klingel über Google-Gruppen macht das Plugin Chromecast4lox. Hier gilt: eine Zone je Raum. Klingel und Wecker über sonn (beta.22): danach läuft die vorherige Wiedergabe nicht (dauerhaft) weiter; ein zweiter Alarm kann die Cast-Ausgabe bis zum Neustart des Containers stören. Der Weckton von sonn ist ein kurzer Gong. Durchsage aus der App geht, die Wiedergabe läuft danach weiter. Für die Klingel deshalb Chromecast4lox verwenden. sonn core ist eine Beta; deshalb läuft eine festgelegte Fassung, ein Update nur nach Ja, mit Rückweg."
H_CONTAINER = "Container"
H_ERWEITERT = "Erweitert – technische Einstellungen von Hand"
