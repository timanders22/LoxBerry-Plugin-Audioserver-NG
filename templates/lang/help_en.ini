; Help texts, English. Belongs to templates/help/help.html. Every value in double quotes, without quotes inside.

[HILFE]
K01 = "Audioserver NG"
K02 = "Starts <b>sonn core</b>, the replica of the Loxone Audioserver, as a Docker container with its own address in the home network. The Loxone app operates the zones like with a real Audioserver; output goes per room to a Google Cast speaker."
K03 = "Limits"
K04 = "No synchronous multi-room playback over Google Cast (audible, growing offset). Google groups cannot be selected as output in sonn - multi-room and doorbell via Google groups is done by <b>Chromecast4lox</b>. sonn core is a beta; the plugin uses a pinned version, an update only after yes, with a way back."
K05 = "How to proceed"
K06 = "<b>Settings:</b> in the box Set up Audioserver at the top look at the suggested values (network, address, shortened MAC, music folder), tick the yes box and click Set up Audioserver - the plugin saves, switches management on and creates sonn. If the trial container sonn-probe exists, the values come from it and its data is copied; the trial stays. Whoever wants to set things by hand opens Advanced. Afterwards the list Next steps guides through the remaining steps."
K17 = "Examples: the tab Loxone integration shows three pictures from the LoxBerry-Plugins sample project - the pages Audioserver NG (service values, heartbeat, status, command buttons), Audioserver NG Werte (8 values per zone with status) and Audioserver NG Zonen (Audio Players with doorbell, alarm clock and announcement)."
K16 = "The plugin looks for a free address at the upper end of the home network (ping and ARP, without addresses of Docker containers). It cannot read the DHCP range of the router, and a device that is switched off does not answer - therefore reserve the address for sonn in the router. The value connected per zone is 1 (connected), 0 (not connected or no output) or -1 (no statement, as with Google Cast)."
K07 = "<b>sonn admin</b> at http://address:7090: create an account, choose Loxone integrated under Zones. The music folder appears in sonn under Content → Library → Local library in the folder LoxBerry-Musik; then “Rescan” or “Rescan library” in the plugin. Do not add a network share in sonn."
K08 = "<b>Loxone Config:</b> Audioserver object with the serial number from the Loxone integration tab and the address as host, one Audio Player per room; load into the Miniserver. In sonn choose the Google Cast speaker per zone."
K09 = "<b>MQTT and test:</b> tick the data points of the checklist in gateway V2, then check the Test tab - especially Container is ONLY in the macvlan network and sonn reports the same MAC id."
K10 = "What the plugin does not do"
K11 = "It never changes a foreign Docker network, removes the trial container only after yes and never deletes the data of sonn - not even on uninstall. It loads nothing into the Miniserver. When re-creating (also update and way back) the previous container is kept stopped until the new one runs; if the new one fails, the old one comes back."
K12 = "Further limits"
K13 = "Doorbell and alarm clock via sonn (beta.22): afterwards the previous playback does not resume (for good); a second alert can disturb the Cast output until the container is restarted. The alarm sound of sonn is a short gong. Announcements from the app work, playback resumes afterwards. For the doorbell use Chromecast4lox instead. If a Google Cast speaker was unreachable (e.g. without power), sonn afterwards reports a playback error on every play, even when it is back on - switch the speaker on, then use “Restart container” in the Settings tab (all zones stop briefly; the plugin never does this by itself). No mounting of SMB shares in the sonn admin - the container would need extra privileges that the plugin does not grant; music comes via the LoxBerry storage selection. LoxBerry Text2Speech as speech provider in sonn is presumably not reachable (a container in the macvlan network cannot reach its LoxBerry) - choose Google or OpenAI in sonn. The data of sonn belongs to root: delete it by hand only with sudo. On the Raspberry Pi the kernel usually does not enforce a memory limit for containers (cgroup_disable=memory): the Test tab shows this as a note, not an error - the CPU limit works."
K14 = "Before every update read the release notes of sonn for breaking changes (example beta.18: switch Loxone on explicitly after a fresh configuration, old audio paths in favourites invalid) and check whether sonn has renamed its package on ghcr.io - then the pinned digest gets no more updates. The list of available versions only reads; the update only runs with the yes checkbox."
K15 = "The LoxBerry backup (clone of the SD card) includes the data folder of sonn. It copies while running - for a surely consistent copy stop sonn first."
K18 = "Favourites (from 0.9.2)"
K19 = "Settings tab, section Favourites: one line per entry <tt>Nr = type | name | source</tt>. <b>Nr is the favourite number in Loxone</b>: Nr 3 plays when a 3 arrives at the input Fav of the Audio Player (playZoneFav/3); in the Loxone app the favourite appears under ‘My favourites’ of the zone. Type <tt>radio</tt> = stream address (http/https, no TuneIn needed), <tt>liste</tt> = folder in the music folder or name of a sonn playlist, <tt>datei</tt> = file in the music folder (file name without tags, otherwise the title as sonn shows it) or http address. For liste and datei the music folder must be scanned (local library, folder LoxBerry-Musik; “Rescan library”); the path starts at the music folder. Save, tick the box, ‘Take over into sonn’ - this replaces the favourites of the selected zones (empty = all); the plugin stores a copy of the previous ones in its data folder. If a folder is missing, only that number is skipped; the others keep their numbers."
K20 = "Example (Nr 5 stays free, Nr 3 is a folder on the music storage):<br><tt>1 = radio | Bayern 1 | https://dispatcher.rndfnk.com/br/br1/obb/mp3/mid<br>2 = radio | Bayern 3 | https://dispatcher.rndfnk.com/br/br3/live/mp3/mid<br>3 = liste | Rainhard Fendrich - Aufleben | R/Rainhard Fendrich/Aufleben<br>4 = liste | Favoriten | Favoriten<br>6 = radio | BR24 (Bayern 5) | https://dispatcher.rndfnk.com/br/br24/live/mp3/mid<br>7 = radio | Antenne Bayern | https://stream.antenne.de/antenne/stream/mp3<br>8 = radio | Ö3 | https://orf-live.ors-shoutcast.at/oe3-q2a<br>9 = radio | Energy München | https://edge01.streamonkey.net/energy-muenchen/stream/mp3</tt>"
