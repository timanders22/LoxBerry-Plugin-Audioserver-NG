<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- Audioserver NG - Lautsprecher mit Schallwellen (Audioserver-Nachbildung).
       Hausform wie Bestand (Regeln/04, 28.10.2026): Radialverlauf, zweiter Ring,
       Schatten am Motiv, Zierpunkte links/rechts, Trennlinie, Name + LOXBERRY. -->
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Hauptmotiv: Lautsprecher (Korb und Membran) mit drei Schallwellen -->
    <g transform="translate(256 206) scale(1.15) translate(-256 -206)">
    <path d="M 186 182 L 214 182 L 254 148 L 254 264 L 214 230 L 186 230 Z" fill="#ffffff" />
    <path d="M 276 180 A 34 34 0 0 1 276 232" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    <path d="M 296 160 A 62 62 0 0 1 296 252" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.8" />
    <path d="M 316 140 A 90 90 0 0 1 316 272" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.5" />
    </g>
    <!-- Flanking Left Symbol: Note (Musikbibliothek) -->
    <g transform="translate(112, 168)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" />
      <rect x="2" y="-13" width="3.5" height="20" fill="#6dac20" />
      <path d="M 5.5 -13 L 12 -9 L 12 -5 L 5.5 -8 Z" fill="#6dac20" />
      <circle cx="-1" cy="8" r="5.5" fill="#6dac20" />
    </g>

    <!-- Flanking Right Symbol: Cast (Ausgabe ueber Google Cast) -->
    <g transform="translate(400, 168)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" />
      <rect x="-12" y="-11" width="24" height="17" rx="2" fill="none" stroke="#6dac20" stroke-width="3" />
      <path d="M -12 13 A 4 4 0 0 1 -8 9" fill="none" stroke="#ffffff" stroke-width="6" />
      <circle cx="-11" cy="12" r="2.2" fill="#6dac20" />
      <path d="M -12 7 A 6 6 0 0 1 -6 13" fill="none" stroke="#6dac20" stroke-width="2.4" />
      <path d="M -12 2 A 11 11 0 0 1 -1 13" fill="none" stroke="#6dac20" stroke-width="2.4" />
    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="0.5">Audioserver NG</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>
