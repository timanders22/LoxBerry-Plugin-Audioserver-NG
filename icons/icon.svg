<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Main Center Motif: Audio Server Rack (Weiter nach unten versetzt) -->
    <g transform="translate(256, 225) scale(1.18)">
      
      <!-- Server Rack Mounting Ears (Left & Right) -->
      <rect x="-75" y="-55" width="10" height="25" rx="3" fill="#ffffff" />
      <rect x="-75" y="30" width="10" height="25" rx="3" fill="#ffffff" />
      <rect x="65" y="-55" width="10" height="25" rx="3" fill="#ffffff" />
      <rect x="65" y="30" width="10" height="25" rx="3" fill="#ffffff" />
      
      <!-- Ear Screw Holes (Background Green Cutouts) -->
      <circle cx="-70" cy="-42.5" r="2.5" fill="#6dac20" />
      <circle cx="-70" cy="42.5" r="2.5" fill="#6dac20" />
      <circle cx="70" cy="-42.5" r="2.5" fill="#6dac20" />
      <circle cx="70" cy="42.5" r="2.5" fill="#6dac20" />

      <!-- Main Server Unit Box -->
      <rect x="-65" y="-75" width="130" height="150" rx="8" fill="#ffffff" />

      <!-- Screen 1: Music Note Display -->
      <rect x="-45" y="-55" width="90" height="60" rx="6" fill="#6dac20" />
      <!-- Note Heads -->
      <circle cx="-12" cy="-20" r="8" fill="#ffffff" />
      <circle cx="16" cy="-25" r="8" fill="#ffffff" />
      <!-- Note Stems -->
      <line x1="-6" y1="-20" x2="-6" y2="-42" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
      <line x1="22" y1="-25" x2="22" y2="-47" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
      <!-- Note Beam -->
      <line x1="-6" y1="-42" x2="22" y2="-47" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

      <!-- Screen 2: Audio Equalizer / Data Bars -->
      <rect x="-45" y="15" width="90" height="45" rx="6" fill="#6dac20" />
      <!-- EQ Bars -->
      <rect x="-39" y="38" width="6" height="14" rx="2" fill="#ffffff" />
      <rect x="-27" y="26" width="6" height="26" rx="2" fill="#ffffff" />
      <rect x="-15" y="40" width="6" height="12" rx="2" fill="#ffffff" />
      <rect x="-3" y="22" width="6" height="30" rx="2" fill="#ffffff" />
      <rect x="9" y="34" width="6" height="18" rx="2" fill="#ffffff" />
      <rect x="21" y="28" width="6" height="24" rx="2" fill="#ffffff" />
      <rect x="33" y="42" width="6" height="10" rx="2" fill="#ffffff" />
      
      <!-- Network / Stream Signal Arcs -->
      <path d="M -15 -90 A 15 15 0 0 1 15 -90" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <path d="M -30 -105 A 32 32 0 0 1 30 -105" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7" />
      <path d="M -45 -120 A 49 49 0 0 1 45 -120" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4" />
    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="27" letter-spacing="0.5">Audioserver NG</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>