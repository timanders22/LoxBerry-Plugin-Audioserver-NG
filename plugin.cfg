[AUTHOR]
NAME=Audioserver NG Plugin Authors
EMAIL=audioserverng@users.noreply.github.com

[PLUGIN]
VERSION=0.9.4
NAME=audioserverng
FOLDER=audioserverng
TITLE=Audioserver NG

[AUTOUPDATE]
# Die Adressen zeigen ausschliesslich auf das eigene Repository dieses Plugins,
# timanders22/LoxBerry-Plugin-Audioserver-NG (Name entschieden am 31.10.2026). Auf ein FREMDES Repository duerfen sie
# nie zeigen: LoxBerry vergleicht Fassungen als Zahl.
#
# Repository angelegt am 01.11.2026 mit der Fassung 0.9.0. AUTOMATIC_UPDATES=true seit 31.10.2026 nach Entscheidung
# des Hausherrn.
#
# Bei jedem weiteren Release: VERSION hier UND in release.cfg erhoehen, beide Adressen dort auf den neuen Tag setzen,
# das Release mit genau diesem Tag anlegen - und danach nachpruefen, dass der Tag wirklich existiert.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Audioserver-NG/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Audioserver-NG/main/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Mindestens 3.0.0: das Plugin liest config/system/general.json (MQTT-Gateway).
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
# sonn core gibt es als Abbild fuer arm64 und amd64 (Registry ghcr.io, gelesen 30.10.2026).
# In Anfuehrungszeichen: ohne sie liest der Installer (Config::Simple) den Wert mit Komma als Liste
# und bricht mit "wrong architecture ARRAY(...)" ab (am LoxBerry 4.0.0.15 gemessen 31.10.2026).
ARCHITECTURE="aarch64,x86_64"
